name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: make install
      - run: npm test
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
